<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found — PARALLEL</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0b0b0d" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Space+Grotesk:wght@600&display=swap" rel="stylesheet" />
    <style>
      :root { --ink: #0b0b0d; --bone: #f2f0ea; --bone-60: rgba(242, 240, 234, 0.62); --accent: #c7ff00; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; min-height: 100svh; display: grid; align-content: center;
        padding: 48px clamp(24px, 5vw, 88px); background: var(--ink); color: var(--bone);
        font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased;
      }
      p.k { margin: 0 0 24px; color: var(--bone-60); font-size: 11px; font-weight: 500; letter-spacing: 0.26em; text-transform: uppercase; }
      h1 {
        margin: 0; max-width: 14ch; font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 600;
        font-size: clamp(34px, 6vw, 80px); line-height: 0.98; letter-spacing: -0.035em; text-transform: uppercase;
      }
      p.lede { margin: 24px 0 48px; max-width: 44ch; font-size: 17px; line-height: 1.6; color: rgba(242, 240, 234, 0.86); }
      nav { display: flex; flex-wrap: wrap; gap: 16px; }
      a {
        display: inline-flex; align-items: center; min-height: 48px; padding: 0 22px; border: 1px solid currentColor;
        color: inherit; text-decoration: none; font-size: 11px; font-weight: 500; letter-spacing: 0.26em; text-transform: uppercase;
        transition: background-color 200ms, color 200ms, border-color 200ms;
      }
      a:hover, a.solid { background: var(--accent); border-color: var(--accent); color: var(--ink); }
      a.solid:hover { background: transparent; color: var(--accent); }
      a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <p class="k">404 · Page not found</p>
      <h1>This shot didn't make the final cut.</h1>
      <p class="lede">The page you were looking for isn't here. Head back to the studio, or tell us about your commercial or film.</p>
      <nav aria-label="Next step">
        <a class="solid" href="/">Back to the studio</a>
        <a href="/#contact">Get a quote</a>
      </nav>
    </main>
  </body>
</html>
